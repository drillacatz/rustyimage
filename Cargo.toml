[package]
name = "rustyimage"
version = "0.2.0"
edition = "2021"
description = "Lightweight local image and animation converter in pure Rust"
license = "MIT"
repository = "https://github.com/drillacatz/rustyimage"
homepage = "https://github.com/drillacatz/rustyimage"


[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = [
    "png",
    "gif",
    "jpeg",
    "webp",
    "bmp",
    "ico",
    "tiff",
    "tga",
] }
open = "5.4.4"
png = "0.17"
resvg = "0.48.1"
rfd = "0.15"
tiny-skia = "0.12.0"
vtracer = "0.6.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
maintainer = "RustyImage Contributors"
copyright = "2026 RustyImage Contributors"
extended-description = "A minimalist, ultra-lightweight, high-performance image, animation, and vector converter written in pure Rust."
section = "graphics"
priority = "optional"
assets = [
    ["target/release/rustyimage", "usr/bin/", "755"],
    ["assets/rustyimage.desktop", "usr/share/applications/", "644"],
    ["assets/rustyimage.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[package.metadata.bundle]
name = "RustyImage"
identifier = "com.rustyimage.app"
icon = ["assets/rustyimage.svg"]
version = "0.2.0"
copyright = "2026 RustyImage Contributors"
category = "Graphics & Design"
short_description = "Lightweight local image and vector converter"

